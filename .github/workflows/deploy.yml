name: Deploy

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target directory and branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "path=~/bot-iut-ts" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "path=~/bot-iut-ts-test" >> "$GITHUB_OUTPUT"
            echo "branch=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ steps.target.outputs.path }}
            git checkout ${{ steps.target.outputs.branch }}
            git pull
            docker compose up -d --build